name: Jev MCP Enterprise CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies (exactly what uv.lock pins)
      run: |
        python -m pip install --upgrade pip
        pip install uv==0.12.13
        uv sync --locked --extra dev --extra engines --python 3.12
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        
    - name: Formatting Check
      run: ruff format --check src tests

    - name: Strict Static Type Checking
      run: mypy src/jev_mcp/
      
    - name: Mathematical Unit Tests (85% coverage gate)
      run: pytest --cov=src --cov-report=term --cov-fail-under=85 tests/

    - name: Dependency Audit (accepted advisories in .pip-audit-ignore)
      run: ./scripts/pip_audit.sh
