# Weekly and grouped, so the lockfile is refreshed in one reviewable PR rather than many.
# CI installs from uv.lock, so every bump proposed here is tested as locked.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Refresh uv.lock only. The default also raises the minimums declared in pyproject.toml
    # to whatever is locked, which upgrades nothing and drops versions verified on purpose.
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      # Pinned for Apple Silicon reproducibility: bump by hand and re-run `make eval`.
      - dependency-name: "mlx"
      - dependency-name: "mlx-lm"
      # A ruff bump changes formatting output: bump by hand with `make format` in the same commit.
      - dependency-name: "ruff"
      # kev caps torch<2.9 and the engines extra needs torch>=2.14.1. The repo declares that with
      # [tool.uv] conflicts, which Dependabot's resolver does not apply, so it reports "No solution"
      # for both. Bump either by hand; pip-audit still gates torch advisories on every CI run.
      - dependency-name: "kev"
      - dependency-name: "torch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
