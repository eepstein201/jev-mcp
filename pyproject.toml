[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP Server for the jev-mcp System 1 evaluation engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pydantic>=2.0.0",
    "fastapi>=0.143.0",
    "python-dotenv>=1.0.1",
    "scikit-learn>=1.0.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "browser-harness>=0.1.13",
    "h2>=4.4.1",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "pyjwt[crypto]>=2.8.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
# Local engines and training (pinned for Apple Silicon reproducibility). Not imported by the
# server: the daemons and `mlx_lm` run as separate processes.
engines = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    # llama.cpp's convert_hf_to_gguf.py imports both; `jev_train_lora` runs it as a subprocess in this
    # environment. 2.14.1 is the first torch release checked clean by pip-audit.
    "torch>=2.14.1",
    "sentencepiece",
]
# Only the alternate `kev.serve` fast engine (jev_mac_manager.sh picks it for a non-GGUF model
# path containing "kev"). Not part of `engines`: kev requires torch<2.9, which carries known
# advisories, so the two extras conflict and need separate environments.
kev = [
    "kev @ git+https://github.com/jaredpalmer/kev.git@2ecafc49fe1e8945cd600443e6c04c1cf0b3a78f",
]
dev = [
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pip-audit==2.10.1",
]

[tool.mypy]
# A `# type: ignore` that no longer suppresses anything hides the next real error on its line.
warn_unused_ignores = true

[tool.pytest.ini_options]
# The eval tests import `tests.evals`, which needs the repo root on the path under a bare `pytest`.
pythonpath = ["."]

[tool.uv]
# kev pins torch<2.9 and engines needs torch>=2.14.1, so they can never share a lock entry.
conflicts = [[{ extra = "engines" }, { extra = "kev" }]]

[tool.hatch.metadata]
# `kev` is installed from its git repository.
allow-direct-references = true

[project.scripts]
jev-mcp = "jev_mcp.server:main"
jev-lint = "jev_mcp.cli_linter:main"
