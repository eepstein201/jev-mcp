[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-mcp"
version = "0.1.0"
description = "MCP Server for the jev-mcp System 1 evaluation engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.0.0",
]

[project.scripts]
jev-mcp = "jev_mcp.server:main"
jev-lint = "jev_mcp.cli_linter:main"
